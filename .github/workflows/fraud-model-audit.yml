name: Fraud model audit and retraining

on:
  workflow_dispatch:
    inputs:
      benchmark:
        description: "Evaluation protocol"
        required: true
        type: choice
        options:
          - both
          - chronological
          - random
        default: both
  push:
    branches: [main, "audit/**"]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/fraud-model-audit.yml"
      - "requirements-ci.txt"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: fraud-model-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit-and-train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run tests
        env:
          PYTHONPATH: src
        run: pytest -q

      - name: Run controlled benchmark and retraining
        env:
          BENCHMARK: ${{ inputs.benchmark || 'both' }}
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"
        run: python scripts/run_fraud_audit.py

      - name: Upload reports and model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fraud-model-audit-${{ github.run_number }}
          path: |
            reports/audit/
            artifacts/audit/
          if-no-files-found: error
          retention-days: 90

      - name: Commit reproducible audit outputs
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/audit/temporal-leakage-and-ci'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/audit artifacts/audit
          if git diff --cached --quiet; then
            echo "No generated outputs changed."
          else
            git commit -m "Add reproducible fraud model audit results"
            git push
          fi
