name: XGBoost business-calibrated investigation economics

on:
  workflow_dispatch:
    inputs:
      analyst_cost:
        description: "Fully loaded cost per investigation (currency units)"
        required: true
        type: string
      fraud_loss:
        description: "Average financial loss per fraudulent transaction (same currency)"
        required: true
        type: string
      recovery_rate:
        description: "Fraction of fraud loss recoverable after investigation (0 to 1)"
        required: true
        type: string
      prevention_rate:
        description: "Fraction of remaining unrecovered loss preventable (0 to 1)"
        required: true
        type: string
      max_cases_per_day:
        description: "Maximum cases investigators can review per calendar day"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: xgboost-business-cost-model-${{ github.ref }}
  cancel-in-progress: false

jobs:
  business-cost-model:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      PYTHONHASHSEED: "42"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-calibrated-research.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-calibrated-research.txt
      - name: Run business-calibrated XGBoost economics
        env:
          PYTHONPATH: src:scripts
        run: |
          python scripts/run_xgboost_business_cost_model.py \
            --analyst-cost "${{ inputs.analyst_cost }}" \
            --fraud-loss "${{ inputs.fraud_loss }}" \
            --recovery-rate "${{ inputs.recovery_rate }}" \
            --prevention-rate "${{ inputs.prevention_rate }}" \
            --max-cases-per-day "${{ inputs.max_cases_per_day }}"
      - name: Upload business-cost report
        uses: actions/upload-artifact@v4
        with:
          name: xgboost-business-cost-${{ github.run_number }}
          path: |
            reports/research/xgboost_business_cost_model.json
            reports/research/xgboost_business_cost_model.csv
          if-no-files-found: error
          retention-days: 90
