name: Calibrated temporal fraud research

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/run_calibrated_temporal_research.py"
      - "scripts/run_walk_forward_benchmark.py"
      - "src/causal_graph_features.py"
      - "src/graph_embedding.py"
      - "tests/test_calibrated_research.py"
      - "requirements-research.txt"
      - ".github/workflows/calibrated-temporal-research.yml"
  push:
    branches: ["main"]
    paths:
      - "scripts/run_calibrated_temporal_research.py"
      - "scripts/run_walk_forward_benchmark.py"
      - "src/causal_graph_features.py"
      - "src/graph_embedding.py"
      - "tests/test_calibrated_research.py"
      - "requirements-research.txt"
      - ".github/workflows/calibrated-temporal-research.yml"

permissions:
  contents: write

concurrency:
  group: calibrated-temporal-research-main
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      PYTHONHASHSEED: "42"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-research.txt
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research.txt
          pip uninstall -y torch
          pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Run research regression tests
        env:
          PYTHONPATH: src:scripts
        run: pytest -q tests/test_calibrated_research.py tests/test_walk_forward_features.py
      - name: Run calibrated temporal experiment
        env:
          PYTHONPATH: src:scripts
        run: python scripts/run_calibrated_temporal_research.py
      - name: Publish research summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r = json.loads(Path("reports/research/calibrated_temporal_report.json").read_text())
          f = r["final_fold"]
          m = f["metrics"]
          print("# Calibrated temporal fraud research")
          print(f"- Selected configuration: **{r['selected_config_id']}**")
          print(f"- Final test period: {f['test']['start']} to {f['test']['end']}")
          print("| Metric | Raw | Isotonic calibrated |")
          print("|---|---:|---:|")
          for k in ("pr_auc", "roc_auc", "brier"):
              print(f"| {k} | {m['raw'][k]:.5f} | {m['isotonic_calibrated'][k]:.5f} |")
          print(f"\n- Validation ECE: {m['validation_calibration']['raw_ece']:.5f} → {m['validation_calibration']['calibrated_ece']:.5f}")
          print("\n## Investigation capacity")
          print("| Capacity | Test precision | Test recall | Test F1 |")
          print("|---|---:|---:|---:|")
          for cap, row in m["capacity_thresholds"].items():
              z = row["test_top_k_metrics"]
              print(f"| {float(cap):.0%} | {z['precision']:.3%} | {z['recall']:.3%} | {z['f1']:.3%} |")
          print("\n## Graph embedding diagnostics")
          for k, v in f["graph_embedding_diagnostics"].items():
              if isinstance(v, (int, float)):
                  print(f"- {k}: {v:.5f}")
          print("\n## PSI methodology")
          print("| Feature | Method | PSI |")
          print("|---|---|---:|")
          for k, v in sorted(f["feature_drift"].items(), key=lambda x: x[1]["psi"] or 0, reverse=True)[:15]:
              print(f"| {k} | {v['method']} | {v['psi'] if v['psi'] is not None else 'NA'} |")
          PY
      - name: Upload reports, predictions and model artifact
        uses: actions/upload-artifact@v4
        with:
          name: calibrated-temporal-research-${{ github.run_number }}
          path: |
            reports/research/calibrated_temporal_report.json
            reports/research/tuning_validation_summary.csv
            reports/research/final_feature_psi.csv
            reports/research/final_fold_predictions.csv
            artifacts/research/calibrated_xgboost_final_fold.joblib
          if-no-files-found: error
          retention-days: 90
      - name: Publish dashboard research report to main
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/research/calibrated_temporal_report.json reports/research/tuning_validation_summary.csv reports/research/final_feature_psi.csv reports/research/final_fold_predictions.csv
          if git diff --cached --quiet; then
            echo "Research report unchanged"
          else
            git commit -m "Publish calibrated temporal research report [skip ci]"
            git push origin HEAD:main
          fi
