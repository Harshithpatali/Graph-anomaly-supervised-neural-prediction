name: Graph intelligence tests

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pandas>=2.2,<3" "numpy>=1.26,<3" "scikit-learn>=1.5,<2" "networkx>=3.3,<4" pytest
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Run customer intelligence tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_customer_intelligence.py
