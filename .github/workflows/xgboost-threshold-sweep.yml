name: XGBoost threshold sweep

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/run_xgboost_threshold_sweep.py"
      - ".github/workflows/xgboost-threshold-sweep.yml"

permissions:
  contents: read

concurrency:
  group: xgboost-threshold-sweep-${{ github.ref }}
  cancel-in-progress: false

jobs:
  threshold-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      PYTHONHASHSEED: "42"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-calibrated-research.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-calibrated-research.txt
      - name: Run XGBoost-only threshold sweep
        env:
          PYTHONPATH: src:scripts
        run: python scripts/run_xgboost_threshold_sweep.py
      - name: Upload threshold results
        uses: actions/upload-artifact@v4
        with:
          name: xgboost-threshold-sweep-${{ github.run_number }}
          path: |
            reports/research/xgboost_threshold_sweep.json
            reports/research/xgboost_threshold_sweep.csv
          if-no-files-found: error
          retention-days: 90
