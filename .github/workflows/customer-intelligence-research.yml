name: Customer intelligence research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/app.py'
      - 'src/customer_*.py'
      - 'src/unsupervised_anomalies.py'
      - 'src/graph_intelligence.py'
      - 'scripts/build_customer_intelligence.py'
      - 'tests/test_customer_intelligence.py'
      - '.github/workflows/customer-intelligence-research.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install 'pandas>=2.2,<3' 'numpy>=1.26,<3' 'scikit-learn>=1.5,<2' 'networkx>=3.3,<4' 'pyarrow>=17,<24' 'pytest>=8,<10' 'streamlit>=1.35' 'plotly>=5.18' 'reportlab>=4,<5'
      - name: Verify PDF reporting dependency\n        run: python -c "import reportlab; print(reportlab.Version)"\n      - name: Compile dashboard and research modules
        run: python -m compileall -q app src scripts
      - name: Run customer intelligence tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_customer_intelligence.py
      - name: Build unsupervised customer intelligence reports
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/build_customer_intelligence.py
      - name: Publish latest bundle to the public repository
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          source = Path("reports/customer_intelligence")
          target = Path("public-data/customer-intelligence-research.zip")
          target.parent.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(target, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(source.rglob("*")):
                  if path.is_file():
                      archive.write(path, path.relative_to(source))
          print(f"Published bundle: {target} ({target.stat().st_size:,} bytes)")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-data/customer-intelligence-research.zip
          if git diff --cached --quiet; then
            echo "Research bundle unchanged; no commit needed."
          else
            git commit -m "data: publish latest customer intelligence bundle"
            git push
          fi
      - name: Upload research reports
        uses: actions/upload-artifact@v4
        with:
          name: customer-intelligence-research
          path: reports/customer_intelligence/
          if-no-files-found: error
          retention-days: 30
