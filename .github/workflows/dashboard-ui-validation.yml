name: Dashboard UI validation

on:
  pull_request:
    paths:
      - "app/app.py"
      - ".github/workflows/dashboard-ui-validation.yml"
  push:
    branches: [main]
    paths:
      - "app/app.py"
      - ".github/workflows/dashboard-ui-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate dashboard Python syntax
        run: python -m py_compile app/app.py
      - name: Check bundled typography fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("app/app.py").read_text(encoding="utf-8")
          assert "fonts.googleapis.com" not in source, "Dashboard still depends on a remote Google Font"
          assert 'family="Segoe UI, Arial, sans-serif"' in source, "Dashboard must use a locally available system font stack"
          assert "background-clip: text" not in source, "Gradient text can become invisible in unsupported browsers"
          # Verify the dark menu portal itself is styled (menus render outside widgets).
          for selector in ('[data-baseweb="popover"]', '[data-baseweb="menu"]', '[role="listbox"]', '[role="option"]'):
              assert selector in source, f"Missing dropdown contrast rule: {selector}"
          assert "background: #111e31 !important" in source, "Dropdown surface must have explicit dark background"
          assert "background: #24415d !important" in source, "Dropdown hover/selected state must be visible"
          assert 'Inter, "Segoe UI"' not in source, "Use the deterministic local system font stack"
          for selector in ('body > div [data-baseweb="popover"]', '[data-baseweb="popover"] [role="listbox"]', '[data-baseweb="popover"] [role="option"]', '[role="option"][data-highlighted="true"]'):
              assert selector in source, f"Missing portal dropdown selector: {selector}"
          assert "background: #101d30 !important" in source, "Dropdown surface must have dark background"
          assert "background: #294967 !important" in source, "Dropdown hover state must be visible"
          assert "z-index: 999999 !important" in source, "Dropdown portal must layer above dashboard content"
          print("Dashboard typography, portal dropdown, and contrast checks passed.")
          PY
